# Nightly encrypted Postgres dump, kept as a workflow artifact for 30 days.
# Needs repo secrets DATABASE_URL (Neon direct connection string) and BACKUP_PASSPHRASE.
# Restore: download the artifact, then
#   gpg --batch --passphrase "$BACKUP_PASSPHRASE" -d transitops.sql.gz.gpg | gunzip | psql "$TARGET_DATABASE_URL"
name: Database backup

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      - name: Dump, compress, encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          /usr/lib/postgresql/16/bin/pg_dump --no-owner --no-privileges "$DATABASE_URL" \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o transitops.sql.gz.gpg
          ls -lh transitops.sql.gz.gpg

      # Encrypted because artifacts of a public repository can be downloaded by anyone.
      - uses: actions/upload-artifact@v4
        with:
          name: transitops-db-${{ github.run_id }}
          path: transitops.sql.gz.gpg
          retention-days: 30
